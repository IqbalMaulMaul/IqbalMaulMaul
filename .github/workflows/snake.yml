name: Update contribution snake

on:
  schedule:
    - cron: '17 20 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/snake.yml']

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Animate the real contribution calendar
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#16805d&color_dots=#ebedf0,#c8e6d4,#8fd3ae,#4bab7d,#237651
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#a7f3d0&color_dots=#161b22,#173e2e,#236644,#369763,#62cf94
      - name: Respect reduced motion
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for path in Path('dist').glob('*.svg'):
              svg = path.read_text()
              css = '<style>@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>'
              path.write_text(svg.replace('</svg>', css + '</svg>'))
          PY
      - name: Publish the animation
        uses: crazy-max/ghaction-github-pages@df5cc2bfa78282ded844b354faee141f06b41865 # v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: true
          jekyll: false
          commit_message: 'Update contribution snake'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
